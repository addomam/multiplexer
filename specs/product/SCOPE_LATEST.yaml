initiative: e04-acp-agent-interaction
core_value: Share one authoritative agent session between humans and local automation without terminal-input ambiguity.
summary: >-
  Add local ACP-backed agent sessions with an amux-owned conversation and
  interaction view. Human and API actions enter the same daemon-owned input
  admission boundary; already-admitted agent work remains visible across handoff.
  The interface distinguishes amux acceptance, transport delivery, agent outcome,
  turn completion and external task acceptance.

  Keep native terminals, stock Zsh, OMP and the delivered Codex terminal route.
  Terminal-only agents are the explicit best-effort fallback, not proof of the
  ACP guarantees. A thin integration API for non-ACP tools is a later milestone.
authorization:
  source: explicit-user-start-ACP-after-current-delivery-publication
  human_surface: user-selected-amux-owned-ACP-view
  handoff_boundary: user-selected-amux-input-admission
  current_delivery: signed-main-a46eaddeb79a9a42628d9cb39cd60945ece27fbb
  new_live_model_runs: separately-approved-only
  global_daemon_config_auth_changes: not-authorized
  release: not-requested
scope_deltas:
  - tag: ADDED
    requirement: Local ACP sessions with shared human/API prompts, genuine form questions, permission decisions, explicit cancellation and owned cleanup.
  - tag: MODIFIED
    before: The structured agent workflow must preserve its upstream native TUI and cannot introduce ACP or a replacement agent view.
    after: ACP sessions use an amux-owned view and one ACP client; stock upstream TUIs remain the separate best-effort terminal fallback.
  - tag: MODIFIED
    before: A safe ownership grant requires provider-application settlement of every forwarded interaction.
    after: ACP handoff seals amux input admission and rejects stale submissions; already-admitted agent work remains inspectable and may continue after transfer. Provider application is a separately reported outcome, not implied by admission.
  - tag: MODIFIED
    before: The current initiative excludes ACP.
    after: Local stdio ACP is in scope; remote services and other deferred protocols remain excluded.
  - tag: ADDED
    requirement: Preserve historical e03s08/all-four failing acceptance and exhausted e03 review records; ACP is new evidence, not a retroactive PASS.
delivered_baseline:
  - {epic: e01, requirement: Native local Zsh terminals, projects, shared CLI API, OMP reports, detach and process cleanup}
  - {epic: e02, requirement: Independent terminal capability explorer and compatibility regressions}
  - {stories: e03s01-e03s07, requirement: Exclusive ownership, handoff, force/cancel/recovery, native ownership UX and limited Codex structured interactions}
in_scope:
  - {story: e04s01, requirement: Open and converse with one local ACP agent through the API and amux view on the same live session}
  - {story: e04s02, requirement: Answer genuine form questions and select offered permission decisions through the shared authoritative interaction state}
  - {story: e04s03, requirement: Transfer ACP input authority, retain running work, reject stale drafts/actions and recover truthful cancellation or connection loss}
  - {story: e04s04, requirement: Verify complete ACP interaction with real maintained agent adapters, truthful fallback tiers and owned resource cleanup}
out_of_scope:
  - {item: New project-wide lifecycle API or UX, reason: User chose existing explicit ACP close and daemon shutdown; broader lifecycle handling follows hands-on use}
  - {item: Thin non-ACP integration API and generic plugin infrastructure, reason: User explicitly places this after a solid ACP implementation}
  - {item: Simultaneous upstream native TUI and ACP writer on the same session, reason: User selected the amux-owned ACP view; reviewed Codex adapter rejects an active competing writer}
  - {item: Remote control services, containers, VMs and relay protocols, reason: Preserve local execution scope}
  - {item: Autonomous orchestration, retries, automatic answers, acceptance or reacquisition policy, reason: Remains external orchestration responsibility}
  - {item: Crash restoration, persisted runtime sessions or durable task ledgers, reason: Preserve memory-only runtime state}
  - {item: Unstable ACP v2, steering and provider-specific extensions, reason: Start from stable ACP v1 and individually negotiated capabilities}
  - {item: Client filesystem/terminal delegation and URL elicitation, reason: Do not advertise unimplemented delegation or browser/auth flows; agent-owned tools remain explicit}
  - {item: Automatic adapter installation, npx latest, upstream forks or global auth/configuration rewrites, reason: Explicit pinned launch and separately authorized live prerequisites only}
constraints:
  - Preserve stock Zsh/OMP behavior and current PTY ownership rules unchanged.
  - A terminal remains a PTY/emulator/process; an ACP conversation view must not be represented by a dummy shell or fake PTY.
  - Runtime ownership, transcripts, pending interactions and work receipts remain memory-only.
  - Atomically order ownership revocation with amux admission; accepted work and unaccepted/stale input are distinct.
  - Force takeover never cancels a turn, abandons its outstanding request/outcome tracking or kills a process.
  - Ordinary takeover cancellation grants nobody, invalidates prior authority and retains admitted work; conditional keep/withdraw preserves human control.
  - Reacquisition policy remains external. Every human/API mutation is gated; intercepted input and stale drafts are never replayed.
  - Preserve separate instance, connection, ACP session, prompt, interaction and ownership identities.
  - Never present local acceptance, a pipe write, a callback response or silence as confirmed agent application.
  - Only one foreground prompt at a time for stable v1; unsupported steering must not become a second prompt.
  - Questions are real elicitation forms, not screen text, synthetic approval prompts or a second shadow agent.
  - Permission responses use exact offered option IDs and preserve once/always and reject/cancel distinctions.
  - Prompts, answers, credentials and raw agent output must not leak into public metadata events or committed evidence.
  - No network/model/auth probing is disguised as an initialize or session/new smoke; use deterministic local peers until live approval.
success_criteria:
  - One real ACP session serves both amux human interaction and local API calls with matching identities and authoritative admission receipts.
  - Nonowners, revoked generations, stale interaction revisions and obsolete connection/session targets cannot admit an action.
  - A handoff cut prevents any unaccepted old UI/API action from becoming accepted afterward; admitted running work remains visible without implicit cancellation.
  - A stopped or stale human view cannot submit an old draft after transfer, and all views show the same committed interaction decision without optimistic losing-answer history.
  - Genuine choice/free-text forms and explicit offered permission allow/deny work end-to-end through both human and API surfaces.
  - Explicit cancellation targets the current amux prompt and is not reported confirmed until its original ACP response supplies the outcome.
  - Disconnects and lost replies retain inspectable state, reject stale identities and never trigger hidden replay or duplicate process launch.
  - Close, exit, failed startup and shutdown clean only owned processes/private resources, with bounded streams and no effect on unrelated sentinels.
  - Existing workspace, terminal, ownership, OMP and independent-showcase regressions remain passing.
  - Real-adapter acceptance requires separate approval, exact versions/models/auth isolation, redacted evidence and cleanup; fixtures alone cannot close acceptance.
