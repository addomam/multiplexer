initiative: e05-thin-tool-integration
status: scoped-not-implementation-approved
core_value: Let a tool share its real semantic interactions between a human and local automation through a thin integration, without implementing ACP or relying on terminal-input guesses.
summary: >-
  Provide a supported local integration contract for tools that cannot or do not
  implement ACP. An integration connects the tool's actual live instance and
  genuine interactions to amux's human and automation surfaces. Tool authors
  should not need an ACP implementation, terminal scraping, a second agent or
  their own ownership arbiter to participate.

  Reuse the delivered ownership, input-admission, canonical interaction and
  outcome semantics rather than establishing weaker parallel guarantees. This
  initiative covers cooperating tools with a supported semantic delivery path.
  Unmodified terminal-only tools remain explicitly best-effort: a new API cannot
  acknowledge application input that the tool itself cannot identify or control.
authorization:
  source: user-requested-thin-non-ACP-API-after-solid-ACP-and-subsequent-merge-and-keep-going
  current_step: scope-and-investigation-on-isolated-feature-branch
  branch: feat/thin-integration-api
  worktree: /Users/addomam/projects/amux-integration-api
  delivered_baseline: af745cdf4045af76a7a34a8bb4260e24057461ce
  implementation: requires-refined-contract-and-reviewed-plan
  new_live_provider_runs: separately-approved-only
  global_daemon_config_auth_changes: not-authorized
  merge_push_tag_release: not-authorized-for-this-new-initiative
scope_deltas:
  - tag: ADDED
    requirement: A thin public tool-integration contract independent of ACP implementation obligations.
  - tag: MODIFIED
    before: Thin non-ACP integration is deferred until ACP acceptance.
    after: ACP is locally landed after actual runtime verification and explicit post-cap human acceptance; scope the previously requested next initiative without reopening its settled contracts.
  - tag: PRESERVED
    requirement: ACP remains supported; existing terminal/Zsh/OMP behavior and unresolved historical native-fence acceptance retain their actual status.
delivered_baseline:
  - {epic: e04, requirement: Same-instance ACP human/API interaction, genuine forms and permission decisions, admission-fenced ownership, bounded cleanup and actual Codex/Grok evidence}
  - {stories: e03s01-e03s07, requirement: Existing native terminal ownership and limited native-Codex structured operations}
  - {integration: OMP, requirement: Existing lifecycle reporting is observation-only, not a structured responder or application-input fence}
in_scope:
  - story: e05s01
    requirement: A tool author can identify one live integration/session, advertise only supported capabilities and distinguish replacement or disconnection from continuity.
  - story: e05s02
    requirement: Human and automation prompts, output and work outcomes address that same live tool instance, with admission, delivery, application, turn completion and task acceptance remaining distinct.
  - story: e05s03
    requirement: Genuine pending questions and offered permission allow/deny decisions can be resolved on either surface under exact current authority, with one canonical decision and explicit unsupported operations.
  - story: e05s04
    requirement: An independently implemented thin integration proves same-instance two-surface effects, ownership transitions, stale-action rejection, bounded resource cleanup and unchanged ACP/terminal regressions using the documented public contract.
out_of_scope:
  - item: Repairing opaque upstream native TUI buffers or claiming a generic terminal application fence
    reason: Without tool cooperation amux cannot know which application work remains; unknown safe grant must still fail closed.
  - item: A second ownership arbiter or weaker integration-specific handoff policy
    reason: The existing broker semantics must remain authoritative across interaction surfaces.
  - item: Automatic retries, answer selection, task acceptance, scheduling or reacquisition policy
    reason: These remain external orchestration responsibilities, not integration primitives.
  - item: Generic plugin infrastructure, remote control services, containers or virtual machines
    reason: Preserve the project's explicit local integration boundary and conventions.
  - item: Persisted runtime sessions, crash restoration or durable conversation/task storage
    reason: Runtime state remains in memory; uncertain continuity must not be manufactured.
  - item: Replacing ACP or changing existing ACP CLI/API contracts merely for symmetry
    reason: Preserve the verified delivered consumer behavior; any necessary migration must be separately justified in the implementation plan.
  - item: A universal provider compatibility matrix, new live-model usage or authentication/configuration rewrites
    reason: A public tool contract is not proof of every provider; live checks and global changes require separate approval.
  - item: Arbitrary language SDKs, package publishing or mandatory third-party framework dependencies
    reason: First establish a small usable public contract and one independent consumer before expanding distribution or tooling.
constraints:
  - Reuse the established daemon ownership and canonical interaction invariants; force never implicitly interrupts or kills, and ordinary pending cancellation grants nobody while retaining admitted work.
  - Conditional keep/withdraw preserves human control; reacquisition policy stays external.
  - Gate every mutating human/API/integration route, reject stale identities and generations, and never replay intercepted or uncertain input.
  - Preserve separate live instance, connection/session, work/call, interaction/revision and ownership identities.
  - Never infer genuine questions, permissions, application success or settlement from terminal text, silence, a pipe write or a lifecycle notification.
  - A declared capability needs a real tool-side delivery/responder path; unsupported or unknown capability fails explicitly rather than falling back to keystrokes.
  - Definite non-admission may permit a new deliberate correction; transport ambiguity cannot justify automatic retry or optimistic accepted history.
  - Keep content private and opt-in; bound retained data, observers, traffic and owned processes, and never expose credentials or raw user/model content in public evidence.
  - Preserve stock Zsh/OMP, current native terminal ownership, ACP behavior and unrelated process/sentinel boundaries.
  - Preserve all historical e03/e04 runtime failures, source attribution and exhausted review caps; this initiative does not reset or relabel them.
success_criteria:
  - A tool author can implement the documented contract without implementing ACP, parsing terminal output, importing broker internals or launching a shadow tool instance.
  - One independently implemented cooperating tool demonstrates real continued work after genuine question answers and exact permission allow/deny, with matching live identities on both surfaces.
  - Competing, revoked, duplicate and stale responses cannot become a second canonical decision; handoff retains admitted work without implicit interruption, and cancellation/reacquisition keep their existing distinctions.
  - Lost connections and lost replies remain inspectable and uncertain where appropriate; no hidden replay, optimistic success or fabricated application acknowledgement occurs.
  - Explicit close, failed startup, connection failure and shutdown prove bounded owned cleanup and do not affect unrelated processes or the existing ACP/terminal consumers.
  - Public documentation states exactly which cooperating-tool guarantees are exercised and why terminal-only fallback remains best-effort.
prior_art:
