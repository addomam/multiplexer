  - {candidate: Existing OMP extension, fit: preserve-and-investigate-as-consumer-not-assume-full-support, evidence: 'integrations/omp/amux.ts reports lifecycle; integrations/omp/lifecycle.ts is explicitly notification-only'}
open_design_questions:
  - Define the smallest tool-facing contract by comparing the existing ACP broker invariants with a non-ACP tool's supported semantic operations; do not settle transport/API spelling in this scope document.
  - Select and inspect the first independent consumer's supported hooks during Elaborate; lifecycle observation alone does not establish answer, permission or mutation support.
  - Define how integrations declare unavailable application acknowledgement without overstating amux admission or opaque native TUI guarantees.
