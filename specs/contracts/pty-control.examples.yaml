- name: Claim read
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
      kind: claim
      ref: claim-private-example
    method: read
- name: Claim cancel
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
