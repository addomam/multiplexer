    op: control-handle
    handle:
      kind: controller
      ref: controller-private-example
    method: view
    view:
      serial: 4
      terminal: pty-example
      focused: null
- name: Explicitly no selected view
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
      kind: controller
      ref: controller-private-example
    method: view
    view:
      serial: 5
      terminal: null
      focused: false
- name: Control read
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
      kind: control
      ref: control-private-example
    method: read
- name: Control release
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
