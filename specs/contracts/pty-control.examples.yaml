contract: pty-control.schema.yaml
scope: Static shape fixtures only; stateful authority and races require real daemon/harness proof.
cases:
- name: Register an external controller on a one-shot socket
  definition: Request
  valid: true
  message:
    version: 1
    op: controller-create
    role: external
    label: orchestrator
- name: Register a native attachment on its persistent connection
  definition: Request
  valid: true
  message:
    version: 1
    op: controller-create
    role: attachment
    label: native window
    persistent: true
- name: Ordinary async claim
  definition: Request
  valid: true
  message:
    version: 1
    op: ownership-claim
    controller:
      kind: controller
      ref: controller-private-example
    terminal: pty-example
    observed:
      generation: 7
      reservation_id: null
    mode: cooperative
    when:
      kind: now
- name: Orchestrator idle policy with visible grace
  definition: Request
  valid: true
  message:
    version: 1
    op: ownership-claim
    controller:
      kind: controller
      ref: controller-private-example
    terminal: pty-example
    observed:
      generation: 7
      reservation_id: null
    mode: cooperative
    when:
      kind: human-idle
      idle_ms: 60000
      warning_ms: 5000
- name: Explicit background scope owner
  definition: Request
  valid: true
  message:
    version: 1
    op: ownership-claim
    controller:
      kind: controller
      ref: controller-private-example
    terminal: pty-example
    observed:
      generation: 7
      reservation_id: null
    mode: cooperative
    when:
      kind: views-backgrounded
      scope: owner
- name: Explicit background scope all
  definition: Request
  valid: true
  message:
    version: 1
    op: ownership-claim
    controller:
      kind: controller
      ref: controller-private-example
    terminal: pty-example
    observed:
      generation: 7
      reservation_id: null
    mode: cooperative
    when:
      kind: views-backgrounded
      scope: all
- name: Force a stranded public reservation without its private handle
  definition: Request
  valid: true
  message:
    version: 1
    op: ownership-claim
    controller:
      kind: controller
      ref: controller-private-example
    terminal: pty-example
    observed:
      generation: 7
      reservation_id: abandoned-claim
    mode: force
- name: Controller read
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
      kind: controller
      ref: controller-private-example
    method: read
- name: Controller close
  definition: Request
  valid: true
