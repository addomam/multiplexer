    version: 1
    op: control-handle
    handle:
      kind: claim
      ref: claim-private-example
    method: force
    observed:
      generation: 7
      reservation_id: claim-example
- name: Accept reserved offered authority
  definition: Request
  valid: true
  message:
    version: 1
    op: control-handle
    handle:
      kind: offer
      ref: offer-private-example
    method: accept
- name: Borrow current control for native text
  definition: Request
  valid: true
  message:
    version: 1
    op: input
    terminal: pty-example
    control:
      kind: control
      ref: control-private-example
    text: hello
- name: Borrow current control for bracketed paste
  definition: Request
  valid: true
  message:
    version: 1
    op: input
    terminal: pty-example
    control:
      kind: control
      ref: control-private-example
    text: 'hello

      '
    paste: true
- name: Borrow current control for raw bytes
  definition: Request
  valid: true
  message:
    version: 1
    op: input
    terminal: pty-example
    control:
      kind: control
      ref: control-private-example
    bytes:
    - 0
    - 27
    - 255
- name: Borrow current control for a named key
  definition: Request
  valid: true
  message:
    version: 1
    op: input
    terminal: pty-example
    control:
      kind: control
      ref: control-private-example
    key: enter
- name: Preserve existing text-over-key precedence
  definition: Request
  valid: true
  message:
    version: 1
    op: input
    terminal: pty-example
    control:
      kind: control
      ref: control-private-example
