    key: enter
- name: Guard source execution without changing queue policy
  definition: Request
  valid: true
  message:
    version: 1
    op: execute
    terminal: pty-example
    control:
      kind: control
      ref: control-private-example
    source: printf ok
    queue: true
- name: Waiting is a successful result with an owner blocker
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: claim-state
      claim:
        kind: claim
        ref: claim-private-example
      claim_id: claim-example
      purpose: manual
      phase: waiting-owner
      terminal: pty-example
      ownership:
        terminal: pty-example
        observed:
          generation: 7
          reservation_id: claim-example
        owner:
          controller_id: human-example
          role: attachment
          label: native window
        reservation:
          claim_id: claim-example
          requester_id: orchestrator-example
          purpose: manual
          phase: waiting-owner
        unsettled: []
        activity_revision: 19
        view_revision: 4
        views:
        - controller_id: human-example
          connected: true
          reported: true
          serial: 3
          terminal: pty-example
          focused: true
      blockers:
      - kind: owner
        elapsed_ms: 3100
      seq: 120
- name: An offered result is not control
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: claim-state
      claim:
        kind: claim
        ref: claim-private-example
      claim_id: claim-example
      purpose: manual
      phase: offered
      terminal: pty-example
      ownership:
        terminal: pty-example
        observed:
          generation: 7
          reservation_id: claim-example
        owner: null
        reservation:
          claim_id: claim-example
          requester_id: orchestrator-example
          purpose: manual
          phase: offered
        unsettled: []
        activity_revision: 19
        view_revision: 4
        views:
        - controller_id: human-example
          connected: true
          reported: true
          serial: 3
          terminal: pty-example
          focused: true
      blockers:
      - kind: requester-acceptance
        elapsed_ms: 0
      seq: 120
      offer:
        kind: offer
        ref: offer-private-example
- name: Conditional countdown retains the human owner
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: claim-state
      claim:
        kind: claim
        ref: claim-private-example
      claim_id: claim-example
      purpose: conditional
      phase: countdown
      terminal: pty-example
      ownership:
        terminal: pty-example
        observed:
          generation: 7
          reservation_id: claim-example
        owner:
          controller_id: human-example
          role: attachment
          label: native window
        reservation:
          claim_id: claim-example
          requester_id: orchestrator-example
          purpose: conditional
          phase: countdown
          conditional:
            when:
              kind: human-idle
              idle_ms: 60000
              warning_ms: 5000
            eligibility: eligible
            ready_for_consent: false
            consent: recorded
            clock:
              kind: warning
              remaining_ms: 5000
        unsettled: []
        activity_revision: 19
        view_revision: 4
        views:
        - controller_id: human-example
          connected: true
          reported: true
          serial: 3
          terminal: pty-example
          focused: true
      blockers:
      - kind: condition
        elapsed_ms: 0
      seq: 120
- name: Unknown application is visible, not a safe grant
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: claim-state
      claim:
        kind: claim
        ref: claim-private-example
      claim_id: claim-example
      purpose: manual
      phase: waiting-settlement
      terminal: pty-example
      ownership:
        terminal: pty-example
        observed:
          generation: 7
          reservation_id: claim-example
        owner: null
        reservation:
          claim_id: claim-example
          requester_id: orchestrator-example
          purpose: manual
          phase: waiting-settlement
        unsettled:
        - &id001
          id: dispatch-example
          kind: agent-mutation
          controller_id: orchestrator-example
          generation: 6
          outcome: unknown
          elapsed_ms: 3100
          agent_instance: instance-example
          session: conversation-example
          request_id: 41
        activity_revision: 19
        view_revision: 4
        views:
        - controller_id: human-example
          connected: true
          reported: true
          serial: 3
          terminal: pty-example
          focused: true
      blockers:
      - kind: settlement
        call: *id001
      seq: 120
- name: Safe grant returns actual input authority
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: control
      control:
        kind: control
        ref: control-private-example
      terminal: pty-example
      generation: 9
      mode: safe
      unsettled: []
      seq: 125
- name: Force retains unresolved-call warning
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: control
      control:
        kind: control
        ref: control-private-example
      terminal: pty-example
      generation: 9
      mode: forced
      unsettled:
      - &id002
        id: dispatch-example
        kind: agent-mutation
        controller_id: orchestrator-example
        generation: 6
        outcome: unknown
        elapsed_ms: 3100
        agent_instance: instance-example
        session: conversation-example
        request_id: 41
      seq: 125
      warning:
        code: prior-calls-may-apply
        calls:
        - *id002
- name: Prior controller reacquires fresh authority without pretending old work settled
  definition: OwnershipResponse
  valid: true
  message:
    version: 1
    ok: true
    result:
      kind: control
      control:
        kind: control
        ref: control-private-example
      terminal: pty-example
      generation: 9
      mode: resumed
      unsettled:
      - id: dispatch-example
        kind: agent-mutation
        controller_id: orchestrator-example
        generation: 6
        outcome: unknown
        elapsed_ms: 3100
        agent_instance: instance-example
        session: conversation-example
        request_id: 41
      seq: 125
- name: Historical grant cannot masquerade as current authority
