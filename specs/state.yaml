    - "Initial round4 full suite had one genuine callback timeout (artifact564); cause not established. No timeout/expectation weakened; subsequent normal-parallel34 ownership/307 workspace passed. Earlier genuine rejection now surfaces directly. See e03-force-presentation-runtime.json."
  open_decisions:
    - "Live checks are separately authorized with cheapest compatible models, preferring local/free inference; no sol. Keep auth/config and owned processes isolated; authorization is not acceptance."
    - "Final complete-broker validation revisited native/application settlement; unknown blocks the first safe offer. A supported native application-consumption acknowledgement remains missing; no fresh isolated spike or force substitute."
decisions:
  - User requirements supply product decisions; routine choices resolved without interview.
  - Repository initialized on feat/amux-mvp after user authorization; local signing disabled.
  - No deployment or release tag requested; delivery is local MVP.
  - OMP 18.8.7 is the supported extension target; macOS arm64 runtime verified, Linux and Rust minimum unverified.
  - Runtime and mechanical acceptance pass; final tree race reproduced/fixed with a passing real-daemon regression.
  - Dual-review cap exhausted; user explicitly authorized main integration without an independent post-fix PASS. No release tag or deployment requested.
  - "User clarified amux provides execution/project/workspace tooling; external orchestration owns tasks, autonomous dispatch, retries, merge policy and automatic answers."
  - "Worktree tooling may be built in initially behind a replaceable boundary; containers, VMs and Kubernetes are future targets, not current backend/plugin implementation scope."
  - "Preserve native interaction and expose equivalent operations via CLI/API; observe agent lifecycle/questions with explicit unsupported, unknown and stale states."
  - "First acceptance workflow is agent interaction in an existing workspace, not worktree provisioning; OMP is preferred but another first harness may be selected if supported interfaces cannot meet the requirements."
  - "First acceptance requires structured question answers and permission allow/deny; advertising these as unsupported does not satisfy acceptance."
  - "Native TUI and CLI/API must remain available on the same live agent instance."
  - "Each live PTY has one interaction owner shared by external controllers and native attachments. Cooperative requests leave the current token valid until owner yield; force or cancellation can invalidate it sooner. Safe transfer settles tracked calls and awaits the reserved requester's acceptance."
  - "Neither safe nor forced takeover cancels the turn or stops the agent; cancel and stop are separate explicit commands, including when takeover is used to ask a side question."
  - "The earlier explicit-yield-only and unconditional application-time-fence requirements are superseded by safe/forced handover and orchestrator-directed reacquisition."
  - "External orchestration decides whether to reacquire after inactivity, on backgrounding, on explicit hand-back or never. amux enforces the request and countdown; human input aborts an attempt without an autonomous retry."
  - "Inactivity reacquisition may use 60 seconds idle and a 5-second warning; these are suggested request parameters rather than an unconditional amux auto-lock policy."
  - "Cancelling pending takeover grants no input authority, invalidates the pre-transfer token and leaves the PTY unowned. The prior orchestrator may request a fresh lock immediately; no old token or owner is automatically restored."
  - "Three seconds triggers visible handoff progress, not automatic transfer. Owner cooperation has no mandatory takeover deadline; force remains available without implying turn cancellation."
  - "User selected C, typed ControlHandle/ClaimHandle/OfferHandle capabilities, over the initial named-verb recommendation; plumbing and server-validated role/lifecycle separation take priority over immediate CLI ergonomics."
  - "Use existing amux api for initial raw access. Async submission returns a claim; a client-side waiter may inspect and accept offers until actual control is granted. Exact command names, force flags and porcelain exit conventions are deferred."
  - "Raw API success is not necessarily ownership acquisition. Local timeout, SIGINT or socket closure does not cancel the claim, release control or prove acquisition failed; inspect authoritative state before explicit cancel/force."
