constraints:
  - One authority and canonical broker; concrete ToolV1 and existing ACP codecs, one owned child per target.
  - Preserve force versus interrupt, ordinary pending cancel, conditional keep/withdraw, no replay and retained admitted work.
  - Every mutation uses exact target/control/generation/call/interaction identities; no pipe-write application inference.
  - Genuine question and exact offered permission callbacks resume original live work; unsupported fails explicitly.
  - Existing terminal/Zsh/OMP lifecycle and ACP public contracts stay unchanged; historical native fence/caps remain as recorded.
  - Runtime in memory; bounded private content and original endpoint/process/worker cleanup proof.
consumer:
  reference: Python-stdlib real arithmetic and permission-gated private ledger tool
  real_tool: standalone OMP SDK adapter pinned to18.12.6 source45c35e40c46166dc726ccc52f5d27f40f2449f99
