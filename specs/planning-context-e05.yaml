feature_name: Thin tool integration without ACP
initiative: e05-thin-tool-integration
status: independently-reviewed-contract-and-build-plan-awaiting-explicit-Build-approval
problem_statement: >-
  Tool authors need a small language-neutral local contract connecting one actual
  tool session and its genuine questions/permissions to amux's owned human/API
  surfaces without implementing ACP, parsing terminals or duplicating authority.
user_decisions:
  public_contract: language-neutral-local-message-API
  author_language: unrestricted
