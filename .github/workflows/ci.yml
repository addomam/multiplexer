name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          test -x /bin/zsh
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
