name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: skip Ubuntu compinit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-1.88.0-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
