name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: cargo test
        env:
          RUST_TEST_THREADS: "1"
      - run: cargo clippy --all-targets -- -D warnings
